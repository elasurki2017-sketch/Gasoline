<style>

h3{
    text-align: center;
}


/* =========================
RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter','Plus Jakarta Sans',Arial,sans-serif;
}

html{
    width:100%;
    overflow-x:hidden;
}

body{
    background:
        radial-gradient(1200px 500px at 100% -10%, rgba(229,57,53,.06), transparent 60%),
        radial-gradient(1000px 500px at -10% 0%, rgba(30,64,175,.05), transparent 55%),
        #eef1f6;
    padding:14px;
    min-height:100vh;
    overflow-x:hidden;
    color:#1f2430;
}

/* =========================
HEADER
========================= */
.header{
    position:sticky;
    top:0;
    z-index:10000;
    background:rgba(238,241,246,.85);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:transform .3s ease;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:18px;
    padding:10px 14px;
    border-radius:16px;
    flex-wrap:wrap;
}

.header.hide-header{
    transform:translateY(-100%);
}

.company h1{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:14px;
    font-weight:800;
    letter-spacing:.2px;
    line-height:1.3;
    background:linear-gradient(90deg,#c62828,#e53935 55%,#ef5350);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}
.company p{
    font-size:10px;
    font-weight:600;
    color:#94a3b8;
    letter-spacing:.3px;
    margin-top:2px;
}

.profile-name{
    font-size:9px;
    margin-top:6px;
    color:#334155;
    font-weight:700;
    text-transform:uppercase;
    line-height:1.2;
}

.profile{
    width:44px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#fff;
    box-shadow:0 2px 10px rgba(30,41,59,.12), inset 0 0 0 1px rgba(15,23,42,.05);
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
}

.profile:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 16px rgba(30,41,59,.18), inset 0 0 0 1px rgba(15,23,42,.05);
}

/* =========================
MENU CARD
========================= */

.menu-card,
.period-card,
.table-card{
    background:#ffffff;
    padding:20px;
    border-radius:18px;
    box-shadow:0 1px 2px rgba(15,23,42,.04), 0 10px 30px -12px rgba(15,23,42,.12);
    border:1px solid rgba(15,23,42,.04);
    margin-bottom:18px;
}

.menu-card{
    padding:10px;
}

.menu-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.menu-btn:hover{
    background:#e2e8f0;
}

.menu-btn.active:hover{
    background:#c62828;
}

/* =========================
PERIOD
========================= */

.period-row{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:nowrap;
}

.period-row label{
    font-weight:700;
    font-size:13px;
    color:#475569;
    margin-right:2px;
}

#monthSelect,
#yearSelect{
    height:40px;
    width:140px;
    padding:0 14px;
    border:1.5px solid #e2e8f0;
    border-radius:10px;
    background:#f8fafc;
    color:#1f2430;

    font-size:14px;
    font-weight:700;

    text-align:center;
    text-align-last:center;

    appearance:none;
    -webkit-appearance:none;
    transition:border-color .15s ease, box-shadow .15s ease;
}

#monthSelect:focus,
#yearSelect:focus{
    outline:none;
    border-color:#e53935;
    box-shadow:0 0 0 3px rgba(229,57,53,.12);
}

/* =========================
TABLE
========================= */

.table-header{
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:8px;
}
.table-header h4{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:14px;
    font-weight:800;
    color:#1e293b;
    position:relative;
    padding-left:12px;
}

.table-header h4::before{
    content:"";
    position:absolute;
    left:0;
    top:1px;
    bottom:1px;
    width:4px;
    border-radius:4px;
    background:linear-gradient(180deg,#e53935,#f57c00);
}

/* =========================
GASOLINE INPUT BUTTON
========================= */

.gasoline-table-header{
    justify-content:space-between;
    flex-wrap:wrap;
}

.add-data-btn{
    padding:9px 16px;
    min-height:38px;
    font-size:12px;
    white-space:nowrap;
}

@media(max-width:480px){
    .gasoline-table-header{
        align-items:stretch;
        flex-direction:column;
    }

    .add-data-btn{
        width:100%;
    }
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
    border-radius:12px;
}



/* =========================
TABLE
========================= */

#mainTable{
    width:100%;
    min-width:900px;
    border-collapse:separate;
    border-spacing:0;
    border:1px solid #333333;
    border-radius:12px;
    overflow:hidden;
    table-layout:fixed;
}

/* Date */
th:nth-child(1),
td.date-cell{
    width:40px;
    min-width:40px;
    max-width:40px;
    padding:2px;
    text-align:center;
}
/* No */
th:nth-child(2),
td.no-cell{
    width:35px;
    min-width:35px;
    max-width:35px;
    text-align:center;
}

.hidden-datefull{
    display:none;
    width:0 !important;
    min-width:0 !important;
    max-width:0 !important;
    padding:0 !important;
    border:none !important;
}
/* Start = kolom 4 */
th:nth-child(4),
td:nth-child(4){
    width:130px;
    min-width:130px;
    max-width:130px;
}

/* Arrive = kolom 5 */
th:nth-child(5),
td:nth-child(5){
    width:130px;
    min-width:130px;
    max-width:130px;
}

/* Parking = kolom 6 */
th:nth-child(6),
td:nth-child(6){
    width:130px;
    min-width:130px;
    max-width:130px;
}

/* Flazz = kolom 7 */
th:nth-child(7){
    width:60px;
    min-width:60px;
    max-width:60px;
}

td:nth-child(7){
    width:60px;
    min-width:60px;
    padding-right:6px;
}

/* Cash = kolom 8 */
th:nth-child(8){
    width:60px;
    min-width:60px;
    max-width:60px;
}

td:nth-child(8){
    width:60px;
    min-width:60px;
    max-width:60px;
    padding-right:6px;
}

/* KM = kolom 9 */
th:nth-child(9),
td:nth-child(9){
    width:60px;
    min-width:60px;
    max-width:60px;
}
/* Total = kolom 10 */
th:nth-child(10),
td:nth-child(10){
    width:70px;
    min-width:70px;
    max-width:70px;
}

th:nth-child(11),
td:nth-child(11),
.action-cell{
    width:70px;
    min-width:70px;
    max-width:70px;
    text-align:center;
    padding:0 !important;
}

.center-cell{
    text-align:center;
    vertical-align:middle;
}

.money-cell{
    text-align:right;
    padding-right:8px;
}

.no-cell{
    text-align:center;
    font-weight:bold;
    vertical-align:middle;
}

th{
    background:linear-gradient(180deg,#4b5563,#374151);
    color:#f1f5f9;
    border:1px solid #333333;
    padding:11px 8px;
    font-size:10px;
    font-weight:700;
    letter-spacing:.3px;
    white-space:nowrap;
}

td{
    border:1px solid #333333;
    padding:6px 7px;
    font-size:9px;
    line-height:1.2;
    height:28px;
    vertical-align:middle;
    color:#334155;
}


.date-cell{
    text-align:center;
    vertical-align:middle;
    font-weight:700;
    font-size:13px;
    color:#e53935;
}
.total-cell{
    text-align:center;
    font-weight:700;
    font-size:11px;
    color:#166534;
    border:1px solid #333333;
}

.placeholder{
    color:#b0b8c4;
    text-align:center;
}

.group-even td,
.group-even .date-cell,
.group-even .total-cell{
    background:#ffffff;
}

.group-odd td,
.group-odd .date-cell,
.group-odd .total-cell{
    background:#e2e8f0;
}

/* =========================
ACTION BUTTONS
========================= */

.action-wrap{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:4px;
}
.action-btn{
    border:none;
    background:transparent;
    cursor:pointer;
    font-size:13px;
    padding:2px;
    width:22px;
    height:22px;
    line-height:1;
    border-radius:6px;
    transition:background .15s ease, transform .1s ease;
}

.action-btn:hover{
    background:rgba(229,57,53,.1);
    transform:translateY(-1px);
}

/* =========================
BOTTOM ACTIONS
========================= */

.bottom-actions{
    margin-top:16px;
    display:flex;
    justify-content:flex-end;
}
.subtotal-box{
    min-width:230px;
    border:1px solid #fde0df;
    padding:12px 16px;
    border-radius:12px;
    background:linear-gradient(135deg,#fff5f5,#fff);
    font-size:13px;
    font-weight:700;
    color:#334155;
    box-shadow:0 4px 14px -6px rgba(229,57,53,.2);
}

.subtotal-value{
    float:right;
    color:#e53935;
    font-weight:800;
}
/* =========================
MODAL BASE
========================= */
.modal-overlay{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(15,23,42,.45);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    z-index:10000;
    padding:20px;
}

.modal-card{
    width:100%;
    max-width:720px;
    background:#fff;
    border-radius:20px;
    padding:24px;
    box-shadow:0 20px 60px -12px rgba(15,23,42,.35);
    border:1px solid rgba(15,23,42,.05);
    animation:modalPop .18s ease;
}
@keyframes modalPop{
    from{ opacity:0; transform:translateY(6px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
}

/* =========================
APP LOADING + SAVE LOADING
========================= */

.loading-overlay{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    gap:14px;

    background:rgba(15,23,42,.72);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    z-index:20000;
    padding:20px;

    opacity:0;
    transition:opacity .35s ease;
}

.loading-overlay.show{
    display:flex;
    opacity:1;
}

.loading-box{
    width:180px;
    padding:24px 18px;
    border-radius:20px;
    background:rgba(255,255,255,.96);
    box-shadow:0 20px 60px rgba(15,23,42,.30);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    animation:loadingBoxIn .45s cubic-bezier(.22,1,.36,1);
}

.loading-spinner{
    width:52px;
    height:52px;

    border-radius:50%;
    border:4px solid #e2e8f0;
    border-top-color:#e53935;

    animation:
        spin .8s linear infinite,
        spinnerPulse 1.5s ease-in-out infinite;
}

.loading-text{
    margin-top:14px;

    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:12px;
    font-weight:700;

    color:#334155;
    text-align:center;
    letter-spacing:.1px;

    min-height:18px;
}

.loading-success{
    display:none;

    width:52px;
    height:52px;

    border-radius:50%;
    background:#16a34a;
    color:#fff;

    font-size:30px;
    font-weight:800;

    align-items:center;
    justify-content:center;

    animation:successPop .45s cubic-bezier(.22,1,.36,1);
}

.loading-overlay.success .loading-spinner{
    display:none;
}

.loading-overlay.success .loading-success{
    display:flex;
}

.loading-overlay.success .loading-text{
    color:#166534;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes spinnerPulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }
}

@keyframes loadingBoxIn{
    from{
        opacity:0;
        transform:translateY(15px) scale(.92);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes successPop{
    0%{
        opacity:0;
        transform:scale(.4);
    }

    70%{
        transform:scale(1.12);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes fadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
}

h3{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;
    color:#1e293b;
    margin-bottom:6px;
}

/* =========================
PROFILE TABLE
========================= */
/* td kanan */
.profile-table td:last-child{
    width:auto;
    padding:6px;
    overflow:hidden;   
}

/* input profile */
.profile-table input{
    display:block;
    width:100%;
    max-width:100%;   
    height:42px;
    padding:0 12px;
    border:1.5px solid #e2e8f0;
    border-radius:10px;
    background:#f8fafc;
    font-size:14px;
    box-sizing:border-box;
}
.profile-table td{
    font-size:12px;
}

.profile-table td:first-child{
    width:1%;
    white-space:nowrap;
    padding-right:12px;
    padding-left:10px;
    background:#f1f5f9;
    color:#475569;
    border-radius:8px;
    font-weight:700;
}

/* =========================
TITLE
========================= */
.modal-title{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:17px;
    font-weight:800;
    margin-bottom:18px;
    color:#1e293b;
    text-align:center;
}

/* =========================
INPUT
========================= */

input,select{
    width:100%;
    padding:10px 12px;
    border:1.5px solid #e2e8f0;
    background:#f8fafc;
    border-radius:10px;
    outline:none;
    font-size:12px;
    color:#1f2430;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
}

input:focus,select:focus{
    border-color:#e53935;
    background:#fff;
    box-shadow:0 0 0 3px rgba(229,57,53,.12);
}

#inputFlazz,
#inputCash,
#inputKm{
    text-align:center;
}

.currency-input{
    text-align:center;
}

/* =========================
INPUT GRID
========================= */
.input-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:20px;
}

.full{
    grid-column:1 / span 2;
}

/* =========================
BUTTONS
========================= */

.form-actions{
    display:flex;
    justify-content:flex-end;
    gap:20px;
    margin-top:25px;   
}

.primary-btn{
    border:none;
    padding:11px 22px;
    cursor:pointer;
    border-radius:10px;
    background:linear-gradient(135deg,#e53935,#c62828);
    color:white;
    font-size:12px;
    font-weight:700;
    letter-spacing:.2px;
    box-shadow:0 6px 16px -6px rgba(198,40,40,.55);
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
}

.primary-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 20px -8px rgba(198,40,40,.6);
    filter:brightness(1.03);
}
.primary-btn:active{
    transform:translateY(0);
    filter:brightness(.97);
}

.secondary-btn{
    background:linear-gradient(135deg,#94a3b8,#64748b);
    box-shadow:0 6px 16px -6px rgba(71,85,105,.4);
}

/* =========================
DELETE CONFIRM
========================= */
.confirm-box{
    width:100%;
    max-width:360px;
    background:#fff;
    border-radius:18px;
    padding:26px;
    text-align:center;
    box-shadow:0 20px 60px -12px rgba(15,23,42,.35);
}

.confirm-text{
    font-size:14px;
    font-weight:600;
    color:#334155;
    margin-bottom:20px;
}

.confirm-buttons{
    display:flex;
    justify-content:center;
    gap:12px;
}

/* =========================
MOBILE
========================= */

@media(max-width:768px){
    .full{
        grid-column:auto;
    }

    .form-actions{
        flex-direction:column;
    }

    .primary-btn{
        width:100%;
    }

    .bottom-actions{
        flex-direction:column;
        align-items:stretch;
    }

}
.menu-btn{

    max-width:180px;

    border-radius:12px;

    font-size:14px;
    font-weight:700;

}

.menu-btn.active{
    background:linear-gradient(135deg,#e53935,#c62828);
    color:#fff;
    box-shadow:0 6px 16px -6px rgba(198,40,40,.5);
}

   VISUAL REVISION — mengikuti gaya screenshot Dashboard

:root{
    --screen-bg:#eef1f6;
    --card-bg:#ffffff;
    --text-main:#263241;
    --text-muted:#7b8794;
    --line:#e1e5ea;
    --line-dark:#d2d8df;
    --soft:#f7f8fa;
    --accent:#8fc5e8;
    --accent-border:#5aa8d8;
    --accent-dark:#4d94c2;
}

*{
    font-family:'Inter',Arial,sans-serif !important;
}

html,body{
    background:var(--screen-bg) !important;
}

body{
    padding:0 !important;

function formatRupiah(value){value=String(value).replace(/\D/g,"");return value===""?"":"Rp "+Number(value).toLocaleString("id-ID");}
function parseRupiah(value){return Number(String(value).replace(/[^\d]/g,"")||0);}

function generateGasolineTable(){const map={Januari:0,Februari:1,Maret:2,April:3,Mei:4,Juni:5,Juli:6,Agustus:7,September:8,Oktober:9,November:10,Desember:11};const tbody=document.getElementById("gasolineBody");tbody.innerHTML="";const month=map[monthSelect.value],year=Number(yearSelect.value);if(month===undefined||!year)return;const days=new Date(year,month+1,0).getDate();for(let d=1;d<=days;d++){const tr=document.createElement("tr");tr.innerHTML=`<td data-full-date=""></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td class="action-cell"><button class="action-btn" onclick="editGasoline(this)">✏️</button><button class="action-btn" onclick="deleteGasoline(this)">🗑️</button></td>`;tbody.appendChild(tr);}}
function sortGasolineData(){gasolineData.sort((a,b)=>new Date(a.date)-new Date(b.date));}
function renderGasolineTable(rows=gasolineData){gasolineData=Array.isArray(rows)?[...rows]:[];sortGasolineData();generateGasolineTable();const tbody=document.getElementById("gasolineBody");gasolineData.forEach(item=>{if(!item||!item.date)return;const date=new Date(item.date);if(isNaN(date.getTime()))return;const tr=tbody.rows[date.getDate()-1];if(!tr)return;tr.dataset.id=item.id||"";tr.cells[0].dataset.fullDate=item.date;tr.cells[0].textContent=date.getDate();tr.cells[1].textContent=item.nopol||"";tr.cells[2].textContent=item.kmInOut||"";tr.cells[3].textContent=Number(item.hKupon)>0?formatRupiah(item.hKupon):"";tr.cells[4].textContent=item.kmIsi||"";tr.cells[5].textContent=item.liter||"";tr.cells[6].textContent=Number(item.total)>0?formatRupiah(item.total):"";tr.cells[7].textContent=Number(item.suspense)>0?formatRupiah(item.suspense):"";});updateGasolineSummary();}
function updateGasolineSummary(){let total=0,suspense=0;document.querySelectorAll("#gasolineBody tr").forEach(tr=>{total+=parseRupiah(tr.cells[6].textContent);suspense+=parseRupiah(tr.cells[7].textContent);});document.getElementById("gasolineTotal").textContent=formatRupiah(total);document.getElementById("gasolineSuspenseTotal").textContent=formatRupiah(suspense);document.getElementById("gasolineSisaSuspense").textContent=formatRupiah(suspense-total);}
function addGasoline(){window.currentGasolineRow=null;["gasolineDate","gasolineNopol","gasolineKmInOut","gasolineHKupon","gasolineKmIsi","gasolineLiter","gasolineTotalRupiah","gasolineSuspense"].forEach(id=>document.getElementById(id).value="");openModal(gasolineModal);}
function editGasoline(btn){const tr=btn.closest("tr");if(!tr)return;window.currentGasolineRow=tr;document.getElementById("gasolineDate").value=tr.cells[0].dataset.fullDate||"";document.getElementById("gasolineNopol").value=tr.cells[1].textContent.trim();document.getElementById("gasolineKmInOut").value=tr.cells[2].textContent.trim();document.getElementById("gasolineHKupon").value=formatRupiah(tr.cells[3].textContent);document.getElementById("gasolineKmIsi").value=tr.cells[4].textContent.trim();document.getElementById("gasolineLiter").value=tr.cells[5].textContent.trim();document.getElementById("gasolineTotalRupiah").value=formatRupiah(tr.cells[6].textContent);document.getElementById("gasolineSuspense").value=formatRupiah(tr.cells[7].textContent);openModal(gasolineModal);}
async function sendGasolineApi(){try{const period=monthSelect.value+"-"+yearSelect.value;if(!monthSelect.value||!yearSelect.value){alert("Period belum dipilih.");return false;}const payload={action:"save",period,rows:gasolineData};const response=await fetch(API_URL_GASOLINE,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:"data="+encodeURIComponent(JSON.stringify(payload))});if(!response.ok)throw new Error("HTTP Error : "+response.status);const result=await response.json();if(result.status===true)return true;alert(result.error||"Gagal menyimpan data.");return false;}catch(err){console.error(err);alert("Terjadi kesalahan\n\n"+err.message);return false;}}
function normalizeGasolineResponse(response){
    if(Array.isArray(response)) return response;
    if(response && Array.isArray(response.rows)) return response.rows;
    if(response && Array.isArray(response.data)) return response.data;
    if(response && response.result && Array.isArray(response.result)) return response.result;
    if(response && response.result && Array.isArray(response.result.rows)) return response.result.rows;
    if(response && response.result && Array.isArray(response.result.data)) return response.result.data;
    return [];
}

function normalizeGasolineDate(value){
    if(value===null || value===undefined) return "";
    let v=String(value).trim();
    if(!v) return "";
    if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
    const d=new Date(v);
    if(isNaN(d.getTime())) return "";
    const y=d.getFullYear();
    const m=String(d.getMonth()+1).padStart(2,"0");
    const day=String(d.getDate()).padStart(2,"0");
    return y+"-"+m+"-"+day;
}

function normalizeGasolineRows(rows){
    return normalizeGasolineResponse(rows).map(item=>{
        if(!item || typeof item!=="object") return null;
        const date=normalizeGasolineDate(item.date ?? item.dateFull ?? item.tanggal ?? item.Date);
        return {...item,date};
    }).filter(item=>item && item.date);
}

function fetchGasolineData(){
    const period=monthSelect.value+"-"+yearSelect.value;
    return new Promise(resolve=>{
        const callback="gasolineCallback_"+Date.now();
        const script=document.createElement("script");
        let finished=false;
        function cleanup(){
            delete window[callback];
            if(script.parentNode) script.parentNode.removeChild(script);
        }
        function finish(rows){
            if(finished) return;
            finished=true;
            const normalized=normalizeGasolineRows(rows);
            console.log("Gasoline period:",period,"rows:",normalized.length,normalized);
            renderGasolineTable(normalized);
            cleanup();
            resolve(normalized);
        }
        window[callback]=finish;
        script.src=API_URL_GASOLINE+"?callback="+callback+"&period="+encodeURIComponent(period)+"&_="+Date.now();
        script.onerror=function(){
            if(finished) return;
            finished=true;
            console.error("Gagal mengambil data Gasoline dari API:",script.src);
            renderGasolineTable([]);
            cleanup();
            resolve([]);
        };
        document.head.appendChild(script);
    });
}
async function deleteGasoline(btn){if(!confirm("Hapus data ini?"))return;const tr=btn.closest("tr");if(!tr)return;const id=tr.dataset.id;gasolineData=gasolineData.filter(item=>item.id!==id);renderGasolineTable(gasolineData);if(await sendGasolineApi()){await fetchGasolineData();alert("Data berhasil dihapus.");}else alert("Gagal menghapus data.");}

saveGasolineBtn.onclick=async function(){if(!validateProfilePeriod())return;const date=document.getElementById("gasolineDate").value.trim();if(!date){alert("Date wajib diisi.");return;}if(!confirm("Data sudah benar?"))return;const rowData={id:window.currentGasolineRow&&window.currentGasolineRow.dataset.id?window.currentGasolineRow.dataset.id:"GAS_"+Date.now(),date,nopol:document.getElementById("gasolineNopol").value.trim(),kmInOut:document.getElementById("gasolineKmInOut").value.trim(),hKupon:parseRupiah(document.getElementById("gasolineHKupon").value),kmIsi:document.getElementById("gasolineKmIsi").value.trim(),liter:document.getElementById("gasolineLiter").value.trim(),total:parseRupiah(document.getElementById("gasolineTotalRupiah").value),suspense:parseRupiah(document.getElementById("gasolineSuspense").value)};const i=gasolineData.findIndex(x=>x.id===rowData.id);if(i>=0)gasolineData[i]=rowData;else gasolineData.push(rowData);renderGasolineTable(gasolineData);showLoading("Menyimpan data Gasoline...");if(!await sendGasolineApi()){hideLoading();return;}await fetchGasolineData();showSuccess("Data Gasoline berhasil disimpan");setTimeout(hideLoading,800);window.currentGasolineRow=null;closeModal(gasolineModal);};

async function exportGasolinePDF(){

    /* ================= PROFILE ================= */
    const employeeName =
        (localStorage.getItem("employeeName") || "").trim();

    const employeeNik =
        (localStorage.getItem("employeeNik") || "").trim();

    const employeeUser =
        (localStorage.getItem("employeeUser") || "").trim();

    const employeeCar =
        (localStorage.getItem("employeeCar") ||
         localStorage.getItem("employeeLocation") || "").trim();

    if(
        !employeeName ||
        !employeeNik ||
        !employeeUser ||
        !employeeCar
    ){
        alert("Silakan lengkapi seluruh data Profile terlebih dahulu.");
        return;
    }

    if(!monthSelect.value || !yearSelect.value){
        alert("Pilih period terlebih dahulu");
        return;
    }

    if(!confirm("Export Gasoline PDF?")){
        return;
    }

    const jsPDF = await ensureJsPDF();
    const doc = new jsPDF("p","mm","a4");

    const PAGE_WIDTH = 210;
    const PAGE_HEIGHT = 297;
    const leftMargin = 12;
    const rightMargin = 12;
    let y = 12;

    /* ================= DESIGN TOKENS ================= */
    const ACCENT = [194,65,12];
    const INK = [30,41,59];
    const MUTED = [71,85,105];
    const LINE = [100,116,139];

    /*
     * FIX:
     * Jangan menggunakan fill hitam/gelap untuk body data.
     * Teks body selalu dipaksa kembali ke INK setelah setiap
     * penggambaran kotak agar data tidak tertutup/menjadi hitam.
     */
    const WHITE = [255,255,255];
    const STRIPE = [226,226,226];
    const HEADFILL = [255,184,0];

    doc.setDrawColor(...LINE);
    doc.setTextColor(...INK);

    /* ================= HEADER / LETTERHEAD ================= */
    doc.setFillColor(...ACCENT);
    doc.rect(0, 0, PAGE_WIDTH, 2.5, "F");
    doc.setFont("helvetica","bold");
    doc.setFontSize(11);
    doc.setTextColor(...INK);
    doc.text("PT TOYOTA ASTRA MOTOR", leftMargin, y);

    y += 4;

    doc.setFont("helvetica","normal");
    doc.setFontSize(8);
    doc.setTextColor(...MUTED);
    doc.text("Human Resource and General Affairs Division", leftMargin, y);

    y += 3.5;
    doc.text("General Affairs Departement", leftMargin, y);

    /* ================= TITLE ================= */
    y += 5;
    doc.setDrawColor(...ACCENT);
    doc.setLineWidth(0.6);
    doc.line(leftMargin, y, PAGE_WIDTH - rightMargin, y);
    doc.setLineWidth(0.2);
    doc.setDrawColor(...LINE);

    y += 5;

    doc.setFont("helvetica","bold");
    doc.setFontSize(12);
    doc.setTextColor(...INK);
    doc.text(
        "LAPORAN PENGGUNAAN BBM BOD",
        PAGE_WIDTH/2,
        y,
        {align:"center"}
    );

    /* ================= PROFILE ================= */
    y += 7;

    const profileData = [
        ["User", employeeUser],
        ["No. Polisi", employeeCar],
        ["Periode", monthSelect.value + " " + yearSelect.value]
    ];

    let profileY = y;
    const labelWidth = 35;
    const valueWidth = 55;
    const rowH = 5;

    doc.setFont("helvetica","normal");
    doc.setFontSize(8);
    doc.setDrawColor(...LINE);

    profileData.forEach((row)=>{

        doc.setFillColor(226,232,240);
        doc.rect(leftMargin, profileY, labelWidth, rowH, "FD");

        doc.setFillColor(...WHITE);
        doc.rect(
            leftMargin + labelWidth,
            profileY,
            valueWidth,
            rowH,
            "FD"
        );

        /* FIX: text color selalu di-set setelah rect */
        doc.setFont("helvetica","bold");
        doc.setTextColor(...INK);
        doc.text(
            String(row[0]),
            leftMargin + 2,
            profileY + 3.6
        );

        doc.setFont("helvetica","normal");
        doc.setTextColor(...INK);
        doc.text(
            String(row[1]),
            leftMargin + labelWidth + 2,
            profileY + 3.6
        );
        profileY += rowH;
    });

    /* ================= KOTAK TANDA TANGAN ================= */
    const approvalWidth = 60;
    const approvalColW = approvalWidth / 2;
    const approvalStartX =
        (PAGE_WIDTH - rightMargin) - approvalWidth;

    let approvalY = y;
    const approvalSignH = 12;

    doc.setDrawColor(...LINE);
    doc.setFillColor(...WHITE);

    doc.rect(
        approvalStartX,
        approvalY,
        approvalColW,
        approvalSignH,
        "FD"
    );

    doc.rect(
        approvalStartX + approvalColW,
        approvalY,
        approvalColW,
        approvalSignH,
        "FD"
    );

    approvalY += approvalSignH;

    doc.setFont("helvetica","bold");
    doc.setFontSize(8);
    doc.setTextColor(...INK);

    doc.setFillColor(226,232,240);

    doc.rect(
        approvalStartX,
        approvalY,
        approvalColW,
        rowH,
        "FD"
    );

    doc.rect(
        approvalStartX + approvalColW,
        approvalY,
        approvalColW,
        rowH,
        "FD"
    );

    /* Nama pada tabel approval mengambil Nama dari Profile */
    doc.setTextColor(...INK);
    doc.text(
        employeeName,
        approvalStartX + approvalColW + approvalColW/2,
        approvalY + 3.6,
        {align:"center"}
    );

    y = Math.max(profileY, approvalY + rowH) + 4;

    /* ================= DATA PER HARI ================= */
    const monthMap = {
        Januari:0, Februari:1, Maret:2, April:3, Mei:4, Juni:5,
        Juli:6, Agustus:7, September:8, Oktober:9,
        November:10, Desember:11
    };

    const bulanIdx = monthMap[monthSelect.value];
    const tahun = Number(yearSelect.value);
    const totalDays =
        new Date(tahun, bulanIdx + 1, 0).getDate();

    let dataByDate = {};

    gasolineData.forEach(item=>{

        if(!item || !item.date) return;
        const d = new Date(item.date);

        if(isNaN(d.getTime())) return;

        if(
            d.getMonth() !== bulanIdx ||
            d.getFullYear() !== tahun
        ) return;

        dataByDate[d.getDate()] = item;
    });

    /* ================= TABLE CONFIG ================= */
    const widths = [
        14, // Tanggal
        28, // NOPOL
        30, // KM IN/OUT
        26, // H. Kupon
        28, // KM Isi BBM
        20, // Liter
        40  // Total Rupiah
    ];

    const rowHeight = 5;

    const tableWidth =
        PAGE_WIDTH - leftMargin - rightMargin;

    const startX = leftMargin;
    const tableRight = startX + tableWidth;

    const headers = [
        "Tanggal",
        "NOPOL",
        "KM IN/OUT",
        "H. KUPON RP.",
        "KM ISI BBM",
        "LITER",
        "TOTAL RUPIAH"
    ];

    function drawHeader(){

        let x = startX;

        doc.setFont("helvetica","bold");
        doc.setFontSize(6.5);

        headers.forEach((h,i)=>{

            doc.setFillColor(...HEADFILL);
            doc.setDrawColor(...LINE);

            doc.rect(
                x,
                y,
                widths[i],
                rowHeight,
                "FD"
            );

            doc.setTextColor(...WHITE);
            doc.text(
                h,
                x + widths[i]/2,
                y + 3.4,
                {align:"center"}
            );

            x += widths[i];
        });

        y += rowHeight;

        doc.setDrawColor(...LINE);
        doc.setTextColor(...INK);
        doc.setFont("helvetica","normal");
    }

    drawHeader();

    /* ================= BODY ================= */
    let totalRupiah = 0;
    let totalSuspense = 0;
    let totalKm = 0;
    let totalLiter = 0;
    let rowColorIndex = 0;

    doc.setFont("helvetica","normal");
    doc.setFontSize(6.5);

    for(let day = 1; day <= totalDays; day++){

        if(y + rowHeight > PAGE_HEIGHT - 40){

            doc.addPage();

            doc.setFillColor(...ACCENT);
            doc.rect(0, 0, PAGE_WIDTH, 2.5, "F");

            y = 15;
            rowColorIndex = 0;

            drawHeader();

            doc.setFont("helvetica","normal");
            doc.setFontSize(6.5);
        }

        const item = dataByDate[day] || null;

        const kmIn =
            item ? (Number(item.kmInOut) || 0) : 0;

        const kmIsi =
            item ? (Number(item.kmIsi) || 0) : 0;

        const liter =
            item ? (Number(item.liter) || 0) : 0;

        const total =
            item ? (Number(item.total) || 0) : 0;

        const suspense =
            item ? (Number(item.suspense) || 0) : 0;

        if(item){

            totalKm += Math.max(0, kmIsi - kmIn);
            totalLiter += liter;
            totalRupiah += total;
            totalSuspense += suspense;
        }

        const cells = [
            day,
            item ? (item.nopol || "") : "",
            item ? (item.kmInOut || "") : "",
            item && Number(item.hKupon) > 0
                ? formatRupiah(item.hKupon)
                : "",
            item ? (item.kmIsi || "") : "",
            item ? (item.liter || "") : "",
            total ? formatRupiah(total) : ""
        ];
        let x = startX;

        cells.forEach((cell,i)=>{

            if(rowColorIndex % 2 === 0){
                doc.setFillColor(...WHITE);
            }else{
                doc.setFillColor(...STRIPE);
            }

            doc.setDrawColor(...LINE);

            doc.rect(
                x,
                y,
                widths[i],
                rowHeight,
                "FD"
            );

            /*
             * FIX UTAMA:
             * jsPDF mempertahankan state warna antar operasi.
             * Setelah setiap rect, setTextColor diulang agar
             * angka/data selalu terlihat jelas.
             */
            doc.setTextColor(...INK);
            doc.setFont("helvetica","normal");
            doc.setFontSize(6.5);

            const isMoneyCol = (i === 3 || i === 6);

            doc.text(
                String(cell),
                x + widths[i]/2,
                y + 3.4,
                {
                    align: "center"
                }
            );

            x += widths[i];
        });

        y += rowHeight;
        rowColorIndex++;
    }

    /* ================= SUB TOTAL ================= */
    const sisaSuspense = totalSuspense - totalRupiah;

    /* ================= PENERIMAAN UANG ================= */

    y += 4;

    const puLabelW = 45;
    const puCol2W = 35;
    const puCol3W = 35;
    const puWidth = puLabelW + puCol2W + puCol3W;
    const puStartX = tableRight - puWidth;
    let puY = y;

    /*
     * FIX FINAL:
     * Semua cell Penerimaan Uang digambar dengan F dan S
     * secara terpisah. Jangan menggunakan "FD", karena pada
     * beberapa kondisi rendering jsPDF fill state dapat terbawa
     * dan menghasilkan area hitam.
     *
     * SetFillColor dilakukan SETIAP kali sebelum cell digambar.
     */
    function drawPUCell(x, yy, w, h, fill){

        doc.setFillColor(
            Number(fill[0]),
            Number(fill[1]),
            Number(fill[2])
        );

        doc.setDrawColor(
            Number(LINE[0]),
            Number(LINE[1]),
            Number(LINE[2])
        );

        doc.rect(x, yy, w, h, "F");

        doc.setDrawColor(
            Number(LINE[0]),
            Number(LINE[1]),
            Number(LINE[2])
        );

        doc.rect(x, yy, w, h, "S");
    }

    function putPUText(textValue, x, yy, align, bold=false){

        doc.setFont(
            "helvetica",
            bold ? "bold" : "normal"
        );

        doc.setFontSize(7);
        /*
         * FIX:
         * Text Penerimaan Uang SELALU hitam.
         * Tidak pernah mengambil warna fill cell.
         */
        doc.setTextColor(
            Number(INK[0]),
            Number(INK[1]),
            Number(INK[2])
        );

        doc.text(
            String(textValue),
            x,
            yy,
            {align: align}
        );
    }

    /* ================= HEADER ================= */
    drawPUCell(
        puStartX,
        puY,
        puWidth,
        rowHeight,
        HEADFILL
    );

    doc.setFont("helvetica","bold");
    doc.setFontSize(8);

    doc.setTextColor(0,0,0);

    doc.text(
        "Penerimaan Uang",
        puStartX + puWidth/2,
        puY + 3.6,
        {align:"center"}
    );

    puY += rowHeight;

    /* ================= BULAN | JUMLAH ================= */

    drawPUCell(
        puStartX,
        puY,
        puLabelW,
        rowHeight,
        STRIPE
    );

    putPUText(
        "Bulan",
        puStartX + puLabelW/2,
        puY + 3.4,
        "center",
        true
    );

    drawPUCell(
        puStartX + puLabelW,
        puY,
        puCol2W + puCol3W,
        rowHeight,
        WHITE
    );

    putPUText(
        "Jumlah",
        puStartX + puLabelW +
            (puCol2W + puCol3W)/2,
        puY + 3.4,
        "center",
        true
    );

    puY += rowHeight;

    /* ================= PERIODE | TOTAL PENERIMAAN ================= */

    drawPUCell(
        puStartX,
        puY,
        puLabelW,
        rowHeight,
        WHITE
    );

    putPUText(
        monthSelect.value + " " + yearSelect.value,
        puStartX + puLabelW/2,
        puY + 3.4,
        "center",
        false
    );

    drawPUCell(
        puStartX + puLabelW,
        puY,
        puCol2W + puCol3W,
        rowHeight,
        STRIPE
    );

    putPUText(
        formatRupiah(totalSuspense),
        puStartX + puLabelW +
            (puCol2W + puCol3W)/2,
        puY + 3.4,
        "center",
        false
    );

    puY += rowHeight;

    /* ================= PEMBELIAN | SISA ================= */

    drawPUCell(
        puStartX,
        puY,
        puLabelW,
        rowHeight,
        STRIPE
    );

    drawPUCell(
        puStartX + puLabelW,
        puY,
        puCol2W,
        rowHeight,
        STRIPE
    );

    putPUText(
        "Pembelian",
        puStartX + puLabelW + puCol2W/2,
        puY + 3.4,
        "center",
        true
    );

    drawPUCell(
        puStartX + puLabelW + puCol2W,
        puY,
        puCol3W,
        rowHeight,
        STRIPE
    );

    putPUText(
        "Sisa",
        puStartX + puLabelW +
            puCol2W + puCol3W/2,
        puY + 3.4,
        "center",
        true
    );

    puY += rowHeight;

    /* ================= SUB TOTAL ================= */

    drawPUCell(
        puStartX,
        puY,
        puLabelW,
        rowHeight,
        STRIPE
    );

    putPUText(
        "Sub Total",
        puStartX + puLabelW/2,
        puY + 3.4,
        "center",
        true
    );

    drawPUCell(
        puStartX + puLabelW,
        puY,
        puCol2W,
        rowHeight,
        WHITE
    );

    putPUText(
        formatRupiah(totalRupiah),
        puStartX + puLabelW + puCol2W/2,
        puY + 3.4,
        "center",
        false
    );

    drawPUCell(
        puStartX + puLabelW + puCol2W,
        puY,
        puCol3W,
        rowHeight,
        WHITE
    );

    putPUText(
        formatRupiah(sisaSuspense),
        puStartX + puLabelW +
            puCol2W + puCol3W/2,
        puY + 3.4,
        "center",
        false
    );

    puY += rowHeight;
    y = puY + 4;

    /* ================= PAGE NUMBER ================= */
    const totalPages = doc.getNumberOfPages();

    for(let i = 1; i <= totalPages; i++){

        doc.setPage(i);

        doc.setDrawColor(...LINE);
        doc.setLineWidth(0.2);

        doc.line(
            leftMargin,
            PAGE_HEIGHT - 13,
            PAGE_WIDTH - rightMargin,
            PAGE_HEIGHT - 13
        );

        doc.setFont("helvetica","normal");
        doc.setFontSize(9);
        doc.setTextColor(...MUTED);

        doc.text(
            i + "/" + totalPages,
            PAGE_WIDTH / 2,
            PAGE_HEIGHT - 8,
            {align:"center"}
        );
    }

    /* ================= SAVE ================= */
    const fileName =
        "Laporan_BBM_" +
        monthSelect.value +
        "_" +
        yearSelect.value +
        ".pdf";

    doc.save(fileName);
}


// Load jsPDF secara aman. Jika CDN pertama gagal, coba CDN cadangan.
function loadScript(src){
    return new Promise((resolve,reject)=>{
        const script=document.createElement("script");
        script.src=src;
        script.onload=resolve;
        script.onerror=()=>reject(new Error("Gagal memuat: "+src));
        document.head.appendChild(script);
    });
}
let jsPdfPromise=null;
async function ensureJsPDF(){
    if(window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
    if(!jsPdfPromise){
        jsPdfPromise=(async()=>{
            const sources=[
                "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
                "https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"
            ];
            for(const src of sources){
                try{
                    await loadScript(src);
                    if(window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
                }catch(e){ console.warn(e.message); }
            }
            throw new Error("Library jsPDF tidak dapat dimuat. Periksa koneksi internet.");
        })();
    }
    return await jsPdfPromise;
}

        monthSelect.value=now.toLocaleString("id-ID",{month:"long"});

    }
    generateGasolineTable();
    await fetchGasolineData();
}

const gasolinePdfBtn=document.getElementById("exportGasolinePdfBtn");if(gasolinePdfBtn)gasolinePdfBtn.addEventListener("click",exportPDF);
